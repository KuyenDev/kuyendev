<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="45%" stop-color="#0E1422"/>
      <stop offset="85%" stop-color="#151D30"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <radialGradient id="indigoGlow" cx="25%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#4F46E5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="75%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(21, 29, 48, 0.75)"/>
      <stop offset="100%" stop-color="rgba(14, 20, 34, 0.85)"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="shadowPhone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="35" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>

    <filter id="shadowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Base -->
  <rect width="1376" height="768" fill="url(#bgGrad)"/>
  <rect width="1376" height="768" fill="url(#indigoGlow)"/>
  <rect width="1376" height="768" fill="url(#cyanGlow)"/>

  <!-- Cuadrícula Geométrica Sutil de Precisión -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="96" x2="1376" y2="96"/>
    <line x1="0" y1="192" x2="1376" y2="192"/>
    <line x1="0" y1="288" x2="1376" y2="288"/>
    <line x1="0" y1="384" x2="1376" y2="384"/>
    <line x1="0" y1="480" x2="1376" y2="480"/>
    <line x1="0" y1="576" x2="1376" y2="576"/>
    <line x1="0" y1="672" x2="1376" y2="672"/>
    <line x1="172" y1="0" x2="172" y2="768"/>
    <line x1="344" y1="0" x2="344" y2="768"/>
    <line x1="516" y1="0" x2="516" y2="768"/>
    <line x1="688" y1="0" x2="688" y2="768"/>
    <line x1="860" y1="0" x2="860" y2="768"/>
    <line x1="1032" y1="0" x2="1032" y2="768"/>
    <line x1="1204" y1="0" x2="1204" y2="768"/>
  </g>

  <!-- COLUMNA IZQUIERDA: CONTENIDO EDITORIAL & MENSAJE CLAVE -->
  <g transform="translate(110, 140)">
    <!-- Badge de categoría -->
    <rect x="0" y="0" width="310" height="38" rx="19" fill="rgba(79, 70, 229, 0.15)" stroke="rgba(99, 102, 241, 0.45)" stroke-width="1.2"/>
    <circle cx="20" cy="19" r="4.5" fill="#06B6D4"/>
    <text x="34" y="24" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">NUEVO ESTÁNDAR PWA · 2026</text>

    <!-- Título Principal -->
    <text x="0" y="95" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
      Tu Sitio Web Ahora
    </text>
    <text x="0" y="152" fill="url(#accentGrad)" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">
      También Es Tu App
    </text>

    <!-- Subtítulo / Descripción -->
    <text x="0" y="205" fill="#94A3B8" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="400" line-height="26">
      <tspan x="0" dy="0">Incorporamos tecnología de aplicaciones web progresivas (PWA):</tspan>
      <tspan x="0" dy="28">instalable en un clic para Android e iOS, pantalla de carga de marca,</tspan>
      <tspan x="0" dy="28">navegación offline y cero comisiones de tiendas de aplicaciones.</tspan>
    </text>

    <!-- Badges de Beneficios Clave -->
    <g transform="translate(0, 310)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="250" height="54" rx="12" fill="rgba(14, 20, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <circle cx="26" cy="27" r="14" fill="rgba(79, 70, 229, 0.25)"/>
        <text x="26" y="32" text-anchor="middle" font-size="14">📱</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Instalación en 1 Toque</text>
        <text x="50" y="40" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Sin pasar por Play Store</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(266, 0)">
        <rect width="250" height="54" rx="12" fill="rgba(14, 20, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <circle cx="26" cy="27" r="14" fill="rgba(6, 182, 212, 0.25)"/>
        <text x="26" y="32" text-anchor="middle" font-size="14">⚡</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Caché &amp; Modo Offline</text>
        <text x="50" y="40" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Carga al instante sin red</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(0, 68)">
        <rect width="250" height="54" rx="12" fill="rgba(14, 20, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <circle cx="26" cy="27" r="14" fill="rgba(16, 185, 129, 0.25)"/>
        <text x="26" y="32" text-anchor="middle" font-size="14">💎</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Splash Screen Propio</text>
        <text x="50" y="40" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Experiencia de app nativa</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(266, 68)">
        <rect width="250" height="54" rx="12" fill="rgba(14, 20, 34, 0.75)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
        <circle cx="26" cy="27" r="14" fill="rgba(245, 158, 11, 0.25)"/>
        <text x="26" y="32" text-anchor="middle" font-size="14">🛡️</text>
        <text x="50" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Ahorro de Millones</text>
        <text x="50" y="40" fill="#64748B" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Cero comisiones ni cobros</text>
      </g>
    </g>
  </g>

  <!-- COLUMNA DERECHA: MAQUETA CINEMATOGRÁFICA DE SMARTPHONE CON APP KUYÉNDEV -->
  <g transform="translate(860, 96)" filter="url(#shadowPhone)">
    <!-- Chasis del Teléfono -->
    <rect x="0" y="0" width="330" height="580" rx="42" fill="#0A0E17" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2.5"/>
    <!-- Borde interior metálico -->
    <rect x="6" y="6" width="318" height="568" rx="36" fill="none" stroke="rgba(79, 70, 229, 0.4)" stroke-width="1"/>
    
    <!-- Pantalla Interior (Display OLED) -->
    <rect x="12" y="12" width="306" height="556" rx="30" fill="#080C14"/>

    <!-- Dynamic Island / Speaker -->
    <rect x="115" y="22" width="100" height="22" rx="11" fill="#030508"/>
    <circle cx="195" cy="33" r="4.5" fill="#151D30"/>

    <!-- Contenido en Pantalla: Splash Screen / App Mode -->
    <g transform="translate(12, 12)">
      <!-- Barra de estado -->
      <text x="24" y="28" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="600">09:41</text>
      <g transform="translate(250, 18)" fill="#FFFFFF">
        <path d="M0 8 h4 v2 h-4 z M5 6 h4 v4 h-4 z M10 4 h4 v6 h-4 z M15 1 h4 v9 h-4 z" opacity="0.9"/>
      </g>

      <!-- Atmósfera de Splash de la App -->
      <circle cx="153" cy="220" r="100" fill="url(#indigoGlow)"/>

      <!-- Isotipo KuyénDev Central con Pulso -->
      <circle cx="153" cy="210" r="42" fill="rgba(14, 20, 34, 0.85)" stroke="rgba(79, 70, 229, 0.6)" stroke-width="1.5"/>
      <!-- Símbolo K estilizado / Luna -->
      <path d="M142 192 v36 M142 210 l22 -18 M142 210 l22 18" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="153" cy="210" r="48" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Título de la App en Splash -->
      <text x="153" y="280" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">KuyénDev</text>
      <text x="153" y="300" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">ESTUDIO TECNOLÓGICO</text>

      <!-- Loader de Barra -->
      <rect x="83" y="325" width="140" height="3" rx="1.5" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="103" y="325" width="60" height="3" rx="1.5" fill="url(#accentGrad)"/>

      <!-- Card Flotante Notificación de App Instalada -->
      <g transform="translate(20, 375)">
        <rect width="266" height="84" rx="16" fill="rgba(14, 20, 34, 0.92)" stroke="rgba(79, 70, 229, 0.45)" stroke-width="1"/>
        <rect x="12" y="16" width="36" height="36" rx="10" fill="rgba(79, 70, 229, 0.25)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1"/>
        <text x="30" y="40" text-anchor="middle" font-size="16">✨</text>
        <text x="58" y="31" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">App Instalada con Éxito</text>
        <text x="58" y="47" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10.5">Acceso directo en pantalla de inicio</text>
        <rect x="58" y="56" width="110" height="18" rx="9" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="0.8"/>
        <text x="113" y="68" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="9" font-weight="700">✓ Standalone Ready</text>
      </g>

      <!-- Barra de navegación inferior táctil -->
      <rect x="88" y="534" width="130" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>

  <!-- Pequeño Card Flotante Externo de Confianza -->
  <g transform="translate(740, 480)" filter="url(#shadowCard)">
    <rect width="230" height="74" rx="14" fill="rgba(14, 20, 34, 0.94)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.2"/>
    <circle cx="36" cy="37" r="18" fill="rgba(6, 182, 212, 0.2)"/>
    <text x="36" y="43" text-anchor="middle" font-size="18">⚡</text>
    <text x="64" y="31" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Web + App en Uno</text>
    <text x="64" y="49" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Sin duplicar costos</text>
  </g>
</svg>

