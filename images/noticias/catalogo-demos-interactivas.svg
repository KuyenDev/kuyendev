<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="40%" stop-color="#0B132B"/>
      <stop offset="80%" stop-color="#09182A"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#27C7D4" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowLg" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowBadge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo Base con Degradado e Iluminación Atmosférica -->
  <rect width="1376" height="768" fill="url(#bgGrad)"/>
  <rect width="1376" height="768" fill="url(#cyanGlow)"/>
  <rect width="1376" height="768" fill="url(#emeraldGlow)"/>
  <rect width="1376" height="768" fill="url(#purpleGlow)"/>

  <!-- Cuadrícula Geométrica Sutil de Ingeniería -->
  <g stroke="rgba(255, 255, 255, 0.035)" stroke-width="1">
    <line x1="0" y1="96" x2="1376" y2="96"/>
    <line x1="0" y1="192" x2="1376" y2="192"/>
    <line x1="0" y1="288" x2="1376" y2="288"/>
    <line x1="0" y1="384" x2="1376" y2="384"/>
    <line x1="0" y1="480" x2="1376" y2="480"/>
    <line x1="0" y1="576" x2="1376" y2="576"/>
    <line x1="0" y1="672" x2="1376" y2="672"/>
    <line x1="172" y1="0" x2="172" y2="768"/>
    <line x1="344" y1="0" x2="344" y2="768"/>
    <line x1="516" y1="0" x2="516" y2="768"/>
    <line x1="688" y1="0" x2="688" y2="768"/>
    <line x1="860" y1="0" x2="860" y2="768"/>
    <line x1="1032" y1="0" x2="1032" y2="768"/>
    <line x1="1204" y1="0" x2="1204" y2="768"/>
  </g>

  <!-- Píldora Superior: Badge de Novedad Oficial -->
  <g transform="translate(688, 70)">
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="rgba(39, 199, 212, 0.12)" stroke="#27C7D4" stroke-width="1.2"/>
    <circle cx="-212" cy="0" r="5" fill="#27C7D4" filter="url(#glowBadge)"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#E0F2FE" letter-spacing="1.2">
      PLATAFORMA KUYÉNDEV · EXPERIENCIA CLIENTE INTERACTIVA
    </text>
  </g>

  <!-- Título Principal en la Ilustración -->
  <text x="688" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.8">
    60 Demostraciones Web en Código Real
  </text>
  <text x="688" y="180" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">
    Prueba, navega e interactúa con tu futuro sitio antes de contratar su desarrollo
  </text>

  <!-- COMPOSICIÓN DE DISPOSITIVOS Y PANTALLAS EN VIVO -->
  <!-- 1. Pantalla Central: Laptop / Monitor Principal con el Visor de Demostración -->
  <g transform="translate(368, 220)" filter="url(#shadowLg)">
    <!-- Marco de Laptop / Monitor Studio -->
    <rect x="0" y="0" width="640" height="420" rx="16" fill="#0F172A" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <!-- Barra superior de navegador Mac -->
    <path d="M0 16 C0 7.16 7.16 0 16 0 L624 0 C632.84 0 640 7.16 640 16 L640 38 L0 38 Z" fill="#1E293B"/>
    <circle cx="20" cy="19" r="5.5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5.5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5.5" fill="#10B981"/>
    <!-- Barra URL de Demostración Real -->
    <rect x="140" y="8" width="360" height="22" rx="6" fill="#0B132B" stroke="rgba(39, 199, 212, 0.3)" stroke-width="1"/>
    <text x="320" y="23" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#38BDF8">
      kuyendev.cl/demos/clinica-dental/01-medical-minimalism.html
    </text>
    <!-- Badge "LIVE HTML" en verde -->
    <rect x="520" y="10" width="96" height="18" rx="4" fill="#065F46" stroke="#10B981" stroke-width="0.8"/>
    <text x="568" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#A7F3D0">● LIVE DEMO</text>

    <!-- Contenido Interior de la Demo Médica -->
    <rect x="0" y="38" width="640" height="382" fill="#F8FAFC"/>
    <!-- Header simulado de la demo -->
    <rect x="0" y="38" width="640" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="32" y="64" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0F172A">CLÍNICA VALDÉS &amp; ASOC.</text>
    <rect x="500" y="47" width="108" height="24" rx="4" fill="#0284C7"/>
    <text x="554" y="63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Agendar Cita</text>

    <!-- Hero de la Demo -->
    <rect x="32" y="105" width="280" height="16" rx="4" fill="#E2E8F0"/>
    <text x="32" y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#0F172A">Odontología de Precisión</text>
    <text x="32" y="174" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#0284C7">y Estética Guiada en 3D</text>
    <text x="32" y="200" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748B">Tecnología intraoral CAD/CAM sin dolor ni esperas.</text>
    <!-- Botón CTA en la demo -->
    <rect x="32" y="220" width="130" height="30" rx="6" fill="#0284C7"/>
    <text x="97" y="239" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Explorar Tratamientos</text>

    <!-- Tarjetas de Doctores en la Demo Simulada -->
    <g transform="translate(340, 100)">
      <rect x="0" y="0" width="268" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="12" y="12" width="70" height="85" rx="6" fill="#E0F2FE"/>
      <!-- Doctor Icon -->
      <circle cx="47" cy="42" r="16" fill="#38BDF8"/>
      <path d="M27 82 C27 65, 67 65, 67 82 Z" fill="#0284C7"/>
      <text x="94" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A">Dra. Elena Valdés</text>
      <text x="94" y="47" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#0284C7">Rehabilitación Oral</text>
      <text x="94" y="65" font-family="'Inter', sans-serif" font-size="8.5" fill="#64748B">Master Harvard / PUC</text>
      <rect x="94" y="76" width="90" height="18" rx="4" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
      <text x="139" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#166534">Registro SIS Activo</text>
    </g>

    <!-- Barra de Herramientas KuyénDev Flotante en la Demo (Demo Viewer Bar) -->
    <g transform="translate(40, 360)">
      <rect x="0" y="0" width="560" height="44" rx="22" fill="rgba(15, 23, 42, 0.94)" stroke="#38BDF8" stroke-width="1.2" filter="url(#shadowLg)"/>
      <text x="24" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#38BDF8">← KuyénDev</text>
      <text x="120" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Estilo #01 · Minimalismo Médico</text>
      <!-- Swatches de Color Interactivos -->
      <circle cx="360" cy="22" r="7" fill="#0284C7" stroke="#FFF" stroke-width="1"/>
      <circle cx="380" cy="22" r="7" fill="#0D9488" stroke="#FFF" stroke-width="1"/>
      <circle cx="400" cy="22" r="7" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <!-- Botón Cotizar este Diseño -->
      <rect x="430" y="8" width="116" height="28" rx="14" fill="#27C7D4"/>
      <text x="488" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#070A12">Cotizar Diseño</text>
    </g>
  </g>

  <!-- 2. Tarjeta Lateral Izquierda: Rubro Fotógrafos &amp; Cineastas -->
  <g transform="translate(68, 280)" filter="url(#shadowLg)">
    <rect x="0" y="0" width="260" height="340" rx="14" fill="#0F172A" stroke="rgba(39, 199, 212, 0.3)" stroke-width="1.2"/>
    <!-- Barra título mini -->
    <rect x="0" y="0" width="260" height="32" rx="14" fill="#1E293B"/>
    <rect x="0" y="20" width="260" height="12" fill="#1E293B"/>
    <circle cx="15" cy="16" r="4" fill="#EF4444"/>
    <circle cx="28" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="41" cy="16" r="4" fill="#10B981"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#38BDF8">FOTOGRAFÍA &amp; CINE</text>
    <!-- Preview interior Dark Cinematic -->
    <rect x="12" y="44" width="236" height="160" rx="8" fill="#000000" stroke="#334155" stroke-width="1"/>
    <circle cx="130" cy="100" r="28" fill="none" stroke="#27C7D4" stroke-width="2"/>
    <polygon points="124,90 142,100 124,110" fill="#27C7D4"/>
    <text x="130" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">DARK CINEMATIC · 4K</text>
    <text x="130" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" fill="#94A3B8">Visor Fullscreen &amp; Transiciones</text>
    <!-- Datos Clave -->
    <text x="16" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">20 Estilos Exclusivos</text>
    <text x="16" y="255" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">Liquid Glass, Brutalismo, Minimal</text>
    <rect x="16" y="275" width="228" height="32" rx="6" fill="rgba(39, 199, 212, 0.15)" stroke="#27C7D4" stroke-width="1"/>
    <text x="130" y="295" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8">Navegar Demostraciones →</text>
  </g>

  <!-- 3. Tarjeta Lateral Derecha: Rubro Peluquería, Belleza &amp; Barbería -->
  <g transform="translate(1048, 280)" filter="url(#shadowLg)">
    <rect x="0" y="0" width="260" height="340" rx="14" fill="#0F172A" stroke="rgba(217, 119, 6, 0.3)" stroke-width="1.2"/>
    <!-- Barra título mini -->
    <rect x="0" y="0" width="260" height="32" rx="14" fill="#1E293B"/>
    <rect x="0" y="20" width="260" height="12" fill="#1E293B"/>
    <circle cx="15" cy="16" r="4" fill="#EF4444"/>
    <circle cx="28" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="41" cy="16" r="4" fill="#10B981"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#F59E0B">PELUQUERÍA &amp; BARBERÍA</text>
    <!-- Preview interior Luxury Black &amp; Gold -->
    <rect x="12" y="44" width="236" height="160" rx="8" fill="#18181B" stroke="#78350F" stroke-width="1"/>
    <circle cx="130" cy="100" r="28" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <text x="130" y="105" text-anchor="middle" font-family="serif" font-size="20" fill="#F59E0B">✂</text>
    <text x="130" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE68A">BLACK &amp; GOLD LUXURY</text>
    <text x="130" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" fill="#A1A1AA">Agenda de Citas &amp; Slider Antes/Después</text>
    <!-- Datos Clave -->
    <text x="16" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">20 Estilos de Autor</text>
    <text x="16" y="255" font-family="'Inter', sans-serif" font-size="9.5" fill="#94A3B8">Vintage Barber, Pop Art, Japandi</text>
    <rect x="16" y="275" width="228" height="32" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1"/>
    <text x="130" y="295" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#FDE68A">Explorar Barber &amp; Beauty →</text>
  </g>

  <!-- Píldoras de Ventajas Tecnológicas al Pie -->
  <g transform="translate(688, 700)">
    <g transform="translate(-420, 0)">
      <rect x="0" y="0" width="240" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="120" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#CBD5E1">✓ 100% Código HTML5/CSS/JS</text>
    </g>
    <g transform="translate(-140, 0)">
      <rect x="0" y="0" width="280" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="140" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#CBD5E1">✓ Cero Plantillas Lentas de WordPress</text>
    </g>
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="240" height="36" rx="18" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)"/>
      <text x="120" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="600" fill="#CBD5E1">✓ Simulador Móvil &amp; Paletas Copiables</text>
