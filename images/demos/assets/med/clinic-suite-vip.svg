<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="vipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#vipBg)"/>
  <!-- Líneas de horizonte tecnológico -->
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#38BDF8" stroke-width="2" opacity="0.4"/>
  
  <!-- Torre de telemetría y consola robotizada Da Vinci -->
  <rect x="180" y="200" width="240" height="360" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="3"/>
  <rect x="210" y="240" width="180" height="100" rx="6" fill="#0284C7" opacity="0.2" stroke="#38BDF8" stroke-width="1"/>
  <path d="M230 290 L260 260 L290 300 L320 270 L360 290" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <text x="300" y="370" fill="#E2E8F0" font-family="monospace" font-size="14" text-anchor="middle">ROBOTIC SURGERY · ARMS READY</text>
  
  <!-- Pabellón Quirúrgico / Camilla híbrida central -->
  <ellipse cx="700" cy="660" rx="220" ry="50" fill="#0F172A" stroke="#38BDF8" stroke-width="2" opacity="0.6"/>
  <rect x="520" y="500" width="360" height="80" rx="12" fill="#1E293B" stroke="#00F0FF" stroke-width="2"/>
  <!-- Iluminación circular en techo -->
  <ellipse cx="700" cy="120" rx="160" ry="35" fill="none" stroke="#00F0FF" stroke-width="6" filter="drop-shadow(0 0 15px #00F0FF)"/>
  <polygon points="580,140 820,140 880,500 520,500" fill="#38BDF8" opacity="0.08"/>

  <rect x="50" y="710" width="460" height="55" rx="10" fill="rgba(8,15,26,0.92)" stroke="#38BDF8" stroke-width="1"/>
  <text x="75" y="744" fill="#38BDF8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Quirófano Robótico Híbrido &amp; Telemetría VIP</text>
</svg>