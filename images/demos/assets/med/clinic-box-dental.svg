<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="chair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <!-- Pared de fondo y suelo -->
  <rect width="1200" height="520" fill="url(#wall)"/>
  <rect y="520" width="1200" height="280" fill="url(#floor)"/>
  <!-- Línea de rodapié higiénico -->
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#64748B" stroke-width="4"/>

  <!-- Ventanal clínico luminoso -->
  <rect x="100" y="60" width="280" height="380" rx="8" fill="#E0F2FE" opacity="0.6" stroke="#94A3B8" stroke-width="4"/>
  <line x1="240" y1="60" x2="240" y2="440" stroke="#94A3B8" stroke-width="4"/>
  <line x1="100" y1="250" x2="380" y2="250" stroke="#94A3B8" stroke-width="4"/>

  <!-- Mueble clínico modular con lavamanos de acero -->
  <rect x="820" y="320" width="320" height="220" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <line x1="820" y1="430" x2="1140" y2="430" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Lavamanos y grifería quirúrgica -->
  <ellipse cx="920" cy="320" rx="45" ry="16" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
  <path d="M920 310 L920 260 Q920 240 940 240 L950 240" fill="none" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>

  <!-- Monitor clínico 3D en brazo articulado -->
  <rect x="700" y="160" width="180" height="120" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <path d="M740 210 Q790 180 840 230" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <text x="790" y="255" fill="#38BDF8" font-family="monospace" font-size="14" text-anchor="middle">ESCÁNER 3D ACTIVO</text>
  <path d="M790 280 L790 360 L680 440" fill="none" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>

  <!-- Sillón Odontológico Ergonómico Central -->
  <!-- Base de acero -->
  <ellipse cx="560" cy="650" rx="140" ry="35" fill="#64748B"/>
  <rect x="535" y="540" width="50" height="110" fill="#94A3B8"/>
  <!-- Asiento y respaldo reclinable -->
  <path d="M380 500 C380 470, 480 470, 520 500 L680 520 C710 520, 740 550, 720 570 L480 570 C430 570, 380 530, 380 500 Z" fill="url(#chair)" stroke="#075985" stroke-width="3"/>
  <!-- Respaldo alto -->
  <path d="M380 500 L290 380 C270 350, 310 320, 340 340 L450 460 Z" fill="url(#chair)" stroke="#075985" stroke-width="3"/>
  <!-- Cabezal articulado -->
  <ellipse cx="280" cy="330" rx="35" ry="22" fill="#0369A1" stroke="#075985" stroke-width="2"/>

  <!-- Lámpara Cialítica LED Superior -->
  <path d="M480 0 L480 140 L420 200" fill="none" stroke="#64748B" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="410" cy="210" rx="55" ry="22" fill="#FFFFFF" stroke="#0284C7" stroke-width="4"/>
  <circle cx="390" cy="210" r="8" fill="#FDE047"/>
  <circle cx="410" cy="210" r="8" fill="#FDE047"/>
  <circle cx="430" cy="210" r="8" fill="#FDE047"/>
  <!-- Haz de luz suave -->
  <polygon points="360,230 460,230 580,480 320,480" fill="#FEF08A" opacity="0.15"/>

  <!-- Badge informativo -->
  <rect x="50" y="710" width="380" height="55" rx="10" fill="rgba(15,23,42,0.85)" stroke="#0284C7" stroke-width="1"/>
  <text x="75" y="744" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700">Box Clínico Odontológico · Norma ISO-5</text>
</svg>