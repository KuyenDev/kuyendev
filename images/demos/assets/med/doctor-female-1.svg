<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="coat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="scrubs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- Halo decorativo -->
  <circle cx="400" cy="420" r="260" fill="#FFFFFF" opacity="0.6"/>
  <!-- Cruz médica de fondo sutil -->
  <path d="M370 120 h60 v60 h60 v60 h-60 v60 h-60 v-60 h-60 v-60 h60 z" fill="#0284C7" opacity="0.08"/>
  
  <!-- Cuerpo / Bata y Ambo -->
  <path d="M160 1000 C180 720, 240 640, 400 640 C560 640, 620 720, 640 1000 Z" fill="url(#coat)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Cuello V ambo médico -->
  <path d="M330 640 L400 780 L470 640 Z" fill="url(#scrubs)"/>
  <!-- Solapa bata médica -->
  <path d="M280 640 L340 880 L400 1000 L320 1000 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <path d="M520 640 L460 880 L400 1000 L480 1000 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Estetoscopio -->
  <path d="M340 680 C340 790, 460 790, 460 680" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <path d="M400 760 L400 820" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
  <circle cx="400" cy="835" r="22" fill="#94A3B8" stroke="#475569" stroke-width="4"/>
  <circle cx="400" cy="835" r="12" fill="#0284C7"/>

  <!-- Credencial Médica -->
  <rect x="230" y="780" width="80" height="110" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="242" y="792" width="56" height="40" rx="4" fill="#E2E8F0"/>
  <line x1="242" y1="846" x2="286" y2="846" stroke="#0284C7" stroke-width="4" stroke-linecap="round"/>
  <line x1="242" y1="858" x2="298" y2="858" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <line x1="242" y1="870" x2="278" y2="870" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

  <!-- Cuello y Cabeza Femenina -->
  <path d="M360 520 L440 520 L440 650 L360 650 Z" fill="#FCE7D6"/>
  <!-- Cabello posterior recogido elegante -->
  <path d="M260 420 C250 260, 550 260, 540 420 C540 580, 500 620, 480 640 L320 640 C300 620, 260 580, 260 420 Z" fill="#451A03"/>
  <!-- Rostro -->
  <ellipse cx="400" cy="430" rx="115" ry="145" fill="#FDEBD0"/>
  <!-- Cabello frontal / peinado profesional -->
  <path d="M285 380 C320 280, 480 270, 515 380 C480 340, 420 330, 400 340 C360 330, 310 350, 285 380 Z" fill="#311302"/>
  <path d="M285 380 C290 440, 310 470, 320 480 C310 420, 320 380, 330 360" fill="none" stroke="#311302" stroke-width="12" stroke-linecap="round"/>

  <!-- Ojos / Expresión cálida -->
  <ellipse cx="355" cy="425" rx="10" ry="6" fill="#1E293B"/>
  <ellipse cx="445" cy="425" rx="10" ry="6" fill="#1E293B"/>
  <circle cx="357" cy="423" r="3" fill="#FFFFFF"/>
  <circle cx="447" cy="423" r="3" fill="#FFFFFF"/>
  <!-- Cejas -->
  <path d="M335 408 Q355 400 375 408" fill="none" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>
  <path d="M425 408 Q445 400 465 408" fill="none" stroke="#451A03" stroke-width="4" stroke-linecap="round"/>
  <!-- Nariz sutil -->
  <path d="M400 425 L396 460 L406 462" fill="none" stroke="#E5B595" stroke-width="3" stroke-linecap="round"/>
  <!-- Sonrisa empática -->
  <path d="M365 490 Q400 520 435 490" fill="none" stroke="#BE185D" stroke-width="4" stroke-linecap="round"/>

  <!-- Placa identificatoria flotante inferior -->
  <rect x="180" y="910" width="440" height="60" rx="30" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" filter="drop-shadow(0 10px 15px rgba(2,132,199,0.15))"/>
  <text x="400" y="940" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Especialista Médica Odontóloga</text>
  <text x="400" y="958" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0284C7">ACREDITACIÓN CLÍNICA PROFESIONAL</text>
</svg>